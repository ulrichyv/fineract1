apiVersion: apps/v1
kind: Deployment
metadata:
  name: fineract-server
  labels:
    app: fineract-server
spec:
  selector:
    matchLabels:
      app: fineract-server
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: fineract-server
        tier: backend
    spec:
      initContainers:
        - name: init-mydb
          image: busybox:1.34
          command: ['sh', '-c', 'echo "Waiting for MySQL..."; timeout 300 sh -c "while ! nc -z fineractmysql 3306; do sleep 2; done"; echo "MySQL is ready"']
      containers:
      - name: fineract-server
        image: apache/fineract:latest
        env:
        - name: FINERACT_SERVER_PORT
          value: "8443"
        - name: SERVER_PORT
          value: "8443"
        - name: JAVA_TOOL_OPTIONS
          value: "-Dserver.port=8443 -Xmx1G"
        - name: FINERACT_NODE_ID
          value: "1"
        - name: FINERACT_HIKARI_DRIVER_CLASS_NAME
          value: org.mariadb.jdbc.Driver
        - name: FINERACT_HIKARI_JDBC_URL
          value: jdbc:mariadb://fineractmysql:3306/fineract_tenants?useSSL=false&allowPublicKeyRetrieval=true
        - name: FINERACT_HIKARI_USERNAME
          valueFrom:
            secretKeyRef:
              name: fineract-tenants-db-secret
              key: username
        - name: FINERACT_HIKARI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fineract-tenants-db-secret
              key: password
        - name: SPRING_OUTPUT_ANSI_ENABLED
          value: "ALWAYS"
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /fineract-provider/actuator/health/liveness
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /fineract-provider/actuator/health/readiness
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
        - containerPort: 8443
          name: https